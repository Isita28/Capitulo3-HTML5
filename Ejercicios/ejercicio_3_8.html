<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Ejercicio 3.8</title></head>
<body>

  <h2>Días de la Semana con Datalist</h2>
  <form method="post" action="#" autocomplete="on">
    <p>
      <label for="dia">Día de la semana:</label>
      <input type="text" id="dia" name="dia" list="diasSemana" placeholder="Seleccione un día" />
      <datalist id="diasSemana">
        <option value="Lunes"></option>
        <option value="Martes"></option>
        <option value="Miércoles"></option>
        <option value="Jueves"></option>
        <option value="Viernes"></option>
        <option value="Sábado"></option>
        <option value="Domingo"></option>
      </datalist>
    </p>
  </form>
</body>
<p><a href="../index.html" style="padding: 8px 12px; background: #7f8c8d; color: white; text-decoration: none; border-radius: 4px;">&larr; Volver al Índice Principal</a></p>
<hr>
</html>
